name: Опубликовать сайт

on:
  push:
    branches: [main]
    paths:
      - 'labs/level-1/07-github-pages/lab-work/index.html'
      - '.github/workflows/pages.yml'

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Подготовить файлы для публикации
        run: |
          mkdir -p dist
          cp labs/level-1/07-github-pages/lab-work/index.html dist/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/deploy-pages@v4
